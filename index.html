<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Biome - Build your own world, one focus session at a time. A free gamified Pomodoro timer, world-building forest, task management, achievements, and synchronized study rooms." />
  <meta name="keywords" content="pomodoro timer, focus app, gamified productivity, study room, focus forest, habit tracker, task manager" />
  <meta name="author" content="Biome" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#10b981" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Biome Focus Forest" />
  <meta property="og:title" content="Biome — Build Your World, One Focus Session at a Time" />
  <meta property="og:description" content="Stay focused, earn unique biome items with each Pomodoro session, and build your thriving forest world. 100% free with ambient soundscapes and study rooms." />
  <meta property="og:image" content="/icon-512.png" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Biome — Gamified Focus Timer & World Builder" />
  <meta name="twitter:description" content="Turn productive minutes into trees, plants, and wonders. Built-in task manager, ambient sounds, and private friend leaderboards." />
  <meta name="twitter:image" content="/icon-512.png" />

  <!-- Apple & Mobile PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Biome" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Biome — Build Your World, One Focus Session at a Time</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- Service Worker registration for PWA / offline support -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(console.warn);
      });
    }
  </script>
</body>

</html>
